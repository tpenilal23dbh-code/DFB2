:root{--bg:#f3efe6;--fg:#1d1c1a;--card:#fff;--gold:#c8962e;--mut:#6b675e;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--fg:#f2efe6;--card:#2a2a2d;--gold:#e0b44f;--mut:#a09b90}}
:root[data-theme="dark"]{--bg:#1c1c1e;--fg:#f2efe6;--card:#2a2a2d;--gold:#e0b44f;--mut:#a09b90}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;-webkit-user-select:none;user-select:none}
#app{width:100%;max-width:420px;height:100%;position:relative;overflow:hidden}
.pg{height:100%;overflow-y:auto;padding:22px 20px;box-sizing:border-box}
h1{font-size:22px;text-align:center;margin:40px 0 28px}h2{font-size:15px;color:var(--gold);margin:22px 0 8px;letter-spacing:.04em;text-transform:uppercase}
p{font-size:14px;line-height:1.5;margin:0 0 10px}
.btn{display:block;width:100%;background:var(--gold);color:#1c1c1e;border:0;border-radius:4px;padding:12px;font-weight:700;font-size:13px;margin:0 0 14px;cursor:pointer}
.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--mut)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top b{flex:1}
.back{background:none;border:0;color:var(--gold);font-size:22px;cursor:pointer;padding:4px 8px}
select,input[type=text],textarea{width:100%;box-sizing:border-box;background:var(--card);color:var(--fg);border:1px solid var(--mut);border-radius:4px;padding:9px;font:inherit;font-size:14px;margin-bottom:10px;-webkit-user-select:text;user-select:text}
textarea{min-height:120px}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px;border-radius:4px;margin-bottom:8px;font-size:14px;cursor:pointer}
.sw{display:inline-block;width:56px;height:100px;border-radius:10px;margin:0 8px 8px 0;background-size:cover;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--gold)}
/* iPhone */
#scr{--s:min(60px,16vw);position:absolute;inset:0;background-size:cover;background-position:center;touch-action:none;overflow:hidden;color:#fff}
.stb{position:absolute;top:0;left:0;right:0;height:54px;padding:0 30px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;font:600 16px -apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;z-index:4;pointer-events:none}
.stb .r{display:flex;gap:6px;align-items:center}
.di{width:112px;height:32px;border-radius:20px;background:#000}
@media(max-width:430px){.di{display:none}}
.home{position:absolute;top:66px;left:0;right:0;padding:0 10px;box-sizing:border-box;transform-origin:top center}
.wgs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 4px 20px}
.wg{aspect-ratio:1;border-radius:22px;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.25;overflow:hidden}
.wg b{font-size:15px}.wg em{font-style:normal;font-size:44px;font-weight:300;line-height:1.1}.wg u{text-decoration:none;margin-top:auto;font-size:15px}
.wgw i{display:block;text-align:center;font:400 11.5px -apple-system,Arial,sans-serif;margin-top:5px;text-shadow:0 1px 2px #0006}
.apps{display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px}
.app{display:flex;flex-direction:column;align-items:center;position:relative;gap:5px}
.app b{width:var(--s);height:var(--s);border-radius:22.4%;overflow:hidden;display:block;box-shadow:0 1px 3px #0003}
.app svg{width:100%;height:100%;display:block}
.app span{font:400 11.5px -apple-system,"Helvetica Neue",Arial,sans-serif;text-shadow:0 1px 2px #0006;white-space:nowrap}
.app.k b{outline:2px dashed #ffe14d}
.app s{position:absolute;top:-4px;right:calc(50% - var(--s) / 2 - 6px);background:#000b;font:700 11px sans-serif;border-radius:8px;padding:1px 6px;text-decoration:none}
.srch{position:absolute;left:50%;transform:translateX(-50%);bottom:116px;background:#0004;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:500 13px -apple-system,Arial,sans-serif;padding:7px 16px;border-radius:18px}
.dock{position:absolute;left:10px;right:10px;bottom:12px;height:94px;border-radius:34px;background:#ffffff47;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}
.gbtn{position:absolute;bottom:130px;left:8px;background:#0003;color:#fff;border:0;border-radius:12px;padding:3px 8px;font-size:11px;opacity:.3;z-index:5}
.exit{position:absolute;bottom:160px;left:8px;z-index:5;background:#000a;color:#fff;border:0;border-radius:12px;padding:5px 10px;font-size:12px}
/* Notas */
.notes{position:absolute;inset:0;background:#f2f2f7;color:#000;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;font-family:-apple-system,"SF Pro Text","InterE","Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
.notes>*{flex:none}
.notes.d{background:#fff}
.ntop{padding:24px 15px 6px;display:flex;justify-content:space-between;align-items:center;color:#e5a50a;font-size:17px;position:sticky;top:0;z-index:2;background:#fffffff2;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ntop.g{background:linear-gradient(#f2f2f7 75%,#f2f2f700);-webkit-backdrop-filter:none;backdrop-filter:none}
.bk{display:flex;align-items:center;gap:9px;background:none;border:0;color:inherit;font:inherit;padding:0 0 0 8px;cursor:pointer}

const INSTR=`<h2>Configuración</h2><p>En Ajustes elige un fondo de pantalla (idealmente una foto igual que la de tu móvil real) y selecciona el famoso y el artículo de la lista de la compra que quieres forzar. También puedes editar hasta 3 listas personalizadas de hasta 99 elementos, con su “Elemento forzado”.</p>
<h2>Desarrollo</h2><p>Pulsa Actuar. Verás la foto de una pantalla de inicio de iPhone con zonas invisibles. Los 9 iconos de las columnas 2 a 4 y filas 1 a 3 (de izquierda a derecha y de arriba abajo) son el teclado de un teléfono: 1 a 9. Cualquier otro sitio es 0. Pulsa el botón tenue ◐ (abajo a la izquierda) para ver las zonas.</p>
<p>Pide un número del 1 al 100. Con “41”: desliza a la izquierda empezando en el 4 (primera pantalla) y luego empezando en el 1 (segunda pantalla). Para 1–9, desliza primero fuera del recuadro (0) y luego en la cifra. Para 100, desliza fuera del recuadro en las dos pantallas. En la tercera pantalla está la app Notas: que el espectador la toque.</p>
<p>En Notas aparece la pantalla de Carpetas: pide que toquen “Todo lo de iCloud” (o “Notas”) y después la lista pedida. Tu elemento de fuerza estará en el número elegido, sin ningún resaltado. La lista se abre desde el principio, como cualquier otra, y hay que buscar el número. Una vez hecho el efecto: en Notas, toca el botón de redactar (abajo a la derecha) para volver a la primera pantalla y repetir. Si lo mantienes pulsado 1 segundo, vuelves directamente al menú. También puedes deslizar hacia abajo en cualquier pantalla de inicio para ir al menú (o pulsar ◐ y luego Menú).</p>
<h2>Tres rutinas básicas</h2><p><b>El gag del bebé.</b> Imprime la foto del famoso y, por detrás, la de un bebé. Guárdala en un sobre. Pide un número, muestra tu lista y revela el famoso. Luego explica que tienes una foto en el sobre: enseña la del bebé… y al darle la vuelta, la real.</p>
<p><b>Lista de la compra.</b> Objeto de fuerza dentro de una bolsa opaca. Pide un número del 1 al 100, revela el artículo y pide que abran la bolsa.</p>
<p><b>Realmente invisible.</b> Baraja azul con un 7♦ boca arriba en medio de una baraja roja (sin el 7♦ rojo). Pide un número del 1 al 52 con la lista de cartas: sale el 7♦, y al darle la vuelta tiene otro color de dorso.</p>
